# Publishes a release when the version in app/build.gradle.kts is one that has no release yet.
# The app's own updater (Settings → About) picks releases up from here.
#
# Needs one repository secret, SIGNING_KEYSTORE_B64: the signing key file, base64-encoded. Every
# release must be signed with the same key, or Android refuses to install it over the last one.
#
# Before publishing, the build is run on an emulator (GitHub's Linux runners have hardware
# acceleration for it): the last release is installed and updated to this build, and the app has
# to start. See .github/scripts/upgrade-smoke.sh. "Run workflow" with "smoke" ticked does the
# build and that test without publishing anything.
#
# After publishing, the app's own updater is tried end to end on an emulator (.github/scripts/
# updater-e2e.sh): the release before is installed and has to update itself to the new one.
# "Run workflow" with "updater" ticked runs just that against the two latest releases.
name: Release

on:
  push:
    branches: [main, online-sources]
    paths: ['app/build.gradle.kts', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      smoke:
        description: Build and run the emulator test even if this version is already published (publishes nothing new)
        type: boolean
        default: false
      updater:
        description: Run the in-app update test against the two latest published releases
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          build=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          test -n "$name" && test -n "$build"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" > /dev/null 2>&1; then published=true; else published=false; fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          # Build and test when there is something to publish, or when asked to just test.
          if [ "$published" = false ] || [ "${{ inputs.smoke }}" = "true" ]; then echo "work=true" >> "$GITHUB_OUTPUT"; else echo "work=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version $name (build $build), published: $published"

      - name: Signing key
        if: steps.version.outputs.work == 'true'
        env:
          KEY: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The repository secret SIGNING_KEYSTORE_B64 is not set. Without the signing key a release could not update the installed app, so none is published."
            exit 1
          fi
          mkdir -p signing
          echo "$KEY" | base64 -d > signing/release.keystore

      - uses: actions/setup-java@v4
        if: steps.version.outputs.work == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        if: steps.version.outputs.work == 'true'
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
        env:
          # Optional repository variable: a Reddit "installed app" client ID to build in (not a secret).
          REDDIT_CLIENT_ID: ${{ vars.REDDIT_CLIENT_ID }}

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The release must survive being installed over the last one.
      - name: Update test on an emulator
        if: steps.version.outputs.work == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/upgrade-smoke.sh app/build/outputs/apk/release/app-release.apk

      - name: Publish
        if: steps.version.outputs.published == 'false'
        env:
          NAME: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          apk="RedGrab-$NAME-$BUILD.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Release notes: this version's part of CHANGELOG.md (the app shows them before installing).
          awk -v v="$NAME" '/^## /{on = ($2 == v)} on && !/^## / && !/^\[Details\]/' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no entry for version $NAME"; exit 1; fi
          printf '\n[All changes](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> notes.md
          gh release create "v$NAME" "$apk" --title "RedGrab $NAME" --notes-file notes.md --target "$GITHUB_SHA"

      # The app's own updater, end to end: the release before this one is installed and has to find,
      # download and install the release just published. It can't hold a release up (it runs after
      # publishing, and depends on GitHub answering the emulator): a failure only shows here.
      - name: In-app update test on an emulator
        if: steps.version.outputs.published == 'false' || inputs.updater
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/updater-e2e.sh

      # The on-device behaviour tests (place kept across tabs, Back, the grid following the clip view, the
      # screens opening). They run after publishing and can't hold a release up: a failure only shows here.
      - name: Behaviour tests on an emulator
        if: steps.version.outputs.work == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --no-daemon connectedDebugAndroidTest
